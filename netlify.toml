# Bản web của Tiệm Ghép Ảnh: chỉ có file tĩnh, không có máy chủ nào nhận ảnh của người dùng.
[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cùng chính sách với bản desktop (electron/protocol.ts). `connect-src 'self'`: trình duyệt tự chặn mọi kết nối ra ngoài,
# nên trang không có đường nào gửi ảnh đi đâu.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Tên file trong /assets có kèm hash nội dung nên giữ được mãi.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# File font được gọi kèm ?v=<hash nội dung> (vite.config.ts) nên giữ được mãi.
[[headers]]
  for = "/fonts/vn/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ảnh mẫu của font không có hash: giữ một tháng, hết hạn thì hỏi lại máy chủ.
[[headers]]
  for = "/fonts/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Trình duyệt phải luôn thấy service worker mới nhất.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Bản web đọc file này để biết đã có bản dựng mới hơn hay chưa.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# Dữ liệu của người dùng gắn với đúng một địa chỉ (origin): mọi địa chỉ khác đều chuyển về tên miền chính.
[[redirects]]
  from = "https://tiemghepanh.netlify.app/*"
  to = "https://tiemghepanh.io.vn/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://tiemghepanh.netlify.app/*"
  to = "https://tiemghepanh.io.vn/:splat"
  status = 301
  force = true
